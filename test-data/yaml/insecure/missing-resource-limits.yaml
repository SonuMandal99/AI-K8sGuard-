apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-resource-limits-test
  namespace: ai-k8sguard
  labels:
    app: missing-resource-limits-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: missing-resource-limits-test

  template:
    metadata:
      labels:
        app: missing-resource-limits-test

    spec:
      containers:
        - name: missing-resource-limits-container
          image: nginx:1.27.1

          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20