apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull-test
  namespace: ai-k8sguard
  labels:
    app: imagepull-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: imagepull-test

  template:
    metadata:
      labels:
        app: imagepull-test

    spec:
      containers:
        - name: imagepull-container
          image: ai-k8sguard/non-existent-image:does-not-exist