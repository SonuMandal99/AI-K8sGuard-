apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-test
  namespace: ai-k8sguard
  labels:
    app: crashloop-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: crashloop-test

  template:
    metadata:
      labels:
        app: crashloop-test

    spec:
      containers:
        - name: crashloop-container
          image: busybox:1.36

          command:
            - /bin/sh
            - -c
            - |
              echo "AI-K8sGuard CrashLoopBackOff test"
              exit 1