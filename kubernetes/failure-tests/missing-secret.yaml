apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-secret-test
  namespace: ai-k8sguard
  labels:
    app: missing-secret-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: missing-secret-test

  template:
    metadata:
      labels:
        app: missing-secret-test

    spec:
      containers:
        - name: missing-secret-container
          image: nginx:1.27.1

          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-k8sguard-missing-secret
                  key: password