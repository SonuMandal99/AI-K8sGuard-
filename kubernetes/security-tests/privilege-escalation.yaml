apiVersion: apps/v1
kind: Deployment
metadata:
  name: privilege-escalation-test
  namespace: ai-k8sguard
  labels:
    app: privilege-escalation-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: privilege-escalation-test

  template:
    metadata:
      labels:
        app: privilege-escalation-test

    spec:
      containers:
        - name: privilege-escalation-container
          image: nginx:1.27.1

          securityContext:
            allowPrivilegeEscalation: true