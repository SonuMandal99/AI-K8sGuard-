apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-resource-limits-test
  namespace: ai-k8sguard
  labels:
    app: missing-resource-limits-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: missing-resource-limits-test

  template:
    metadata:
      labels:
        app: missing-resource-limits-test

    spec:
      containers:
        - name: missing-resource-limits-container
          image: nginx:1.27.1