apiVersion: apps/v1
kind: Deployment
metadata:
  name: latest-image-tag-test
  namespace: ai-k8sguard
  labels:
    app: latest-image-tag-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: latest-image-tag-test

  template:
    metadata:
      labels:
        app: latest-image-tag-test

    spec:
      containers:
        - name: latest-image-container
          image: nginx:latest

          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20