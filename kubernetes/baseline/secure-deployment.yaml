apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-baseline
  namespace: ai-k8sguard
  labels:
    app: secure-baseline
spec:
  replicas: 1

  selector:
    matchLabels:
      app: secure-baseline

  template:
    metadata:
      labels:
        app: secure-baseline

    spec:
      containers:
        - name: secure-baseline
          image: nginx:1.27.1

          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20